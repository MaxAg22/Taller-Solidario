<body>
  <h1>Alternativa A · Detalle en bloques</h1>
  <p class="intro">Vista elegida con los estilos de la aplicación. Usá el control para recorrer las distintas situaciones de Órdenes e Inventario.</p>
  <main class="alternatives" id="alternatives"></main>
  <script>
    const baseOrders = [
      { id: 18, recipient: 'Escuela Ibarzabal', date: '2026-12-12', status: 'En Preparación', description: 'Equipamiento para el aula de informática.', teams: [
        { id: 1, name: 'ThinkPad T480', serial: 'TS-24018', status: 'Listo para donar', specs: 'i5 · 16 GB RAM · 256 GB SSD' },
        { id: 2, name: 'Dell Latitude 5400', serial: 'TS-24027', status: 'Listo para donar', specs: 'i5 · 8 GB RAM · 256 GB SSD' }
      ] },
      { id: 17, recipient: 'Biblioteca Popular Alberdi', date: '2026-11-20', status: 'Donado', description: 'Equipos para uso comunitario.', teams: [
        { id: 3, name: 'HP ProBook 440', serial: 'TS-23104', status: 'Donado', specs: 'i5 · 8 GB RAM · 500 GB SSD' }
      ] },
      { id: 16, recipient: 'Centro Vecinal Norte', date: '2027-01-09', status: 'En Preparación', description: '', teams: [] }
    ];
    const availableTeams = [
      { id: 4, name: 'Lenovo ThinkPad L14', serial: 'TS-24055', model: 'ThinkPad L14', specs: 'i5 · 16 GB RAM · 256 GB SSD' },
      { id: 5, name: 'Dell Latitude 5410', serial: 'TS-24061', model: 'Latitude 5410', specs: 'i5 · 8 GB RAM · 256 GB SSD' },
      { id: 6, name: 'HP EliteBook 840', serial: 'TS-24072', model: 'EliteBook 840', specs: 'i5 · 16 GB RAM · 512 GB SSD' }
    ];
    const states = [
      ['normal', 'Datos de ejemplo'], ['empty-orders', 'Sin órdenes'], ['no-results', 'Sin coincidencias'],
      ['no-teams', 'Orden sin equipos'], ['no-available', 'Sin equipos disponibles'],
      ['loading', 'Cargando'], ['error', 'Error de consulta'], ['donated', 'Orden Donado']
    ];
    const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

    function makeApp(id, layout) {
      return { id, layout, page: 'orders', mode: 'view', state: 'normal', orders: structuredClone(baseOrders), currentId: 18, draft: null, modal: null, toast: '', serial: 'TS-24018', search: '', dateFrom: '', dateTo: '', allStates: false };
    }
    const apps = [makeApp('a', 'layout-a')];
    const root = document.getElementById('alternatives');
    root.innerHTML = apps.map(app => `
      <section class="alternative ${app.layout}" id="alt-${app.id}">
        <header class="alt-head"><h2>Controles de vista previa</h2><p>Controles del prototipo</p></header>
        <div class="controls">
          <label>Estado de ejemplo<select data-action="state">${states.map(([v,l]) => `<option value="${v}">${l}</option>`).join('')}</select></label>
          <button data-action="all">Ver todos los estados</button>
        </div>
        <div class="screen" data-screen></div>
        <div class="tradeoff">Los campos de la orden aparecen antes que la lista completa de equipos asociados.</div>
        <div class="allstates hidden" data-allstates></div>
      </section>`).join('');
    apps.forEach(app => {
      root.querySelectorAll(`#alt-${app.id} [data-action="state"]`)[0].addEventListener('change', e => {
        app.state = e.target.value; app.orders = structuredClone(baseOrders); app.mode = 'view'; app.draft = null; app.toast = '';
        if (app.state === 'no-teams') app.orders[0].teams = [];
        if (app.state === 'donated') { app.orders[0].status = 'Donado'; app.orders[0].teams.forEach(t => t.status = 'Donado'); }
        render(app);
      });
      root.querySelector(`#alt-${app.id} [data-action="all"]`).addEventListener('click', () => { app.allStates = !app.allStates; render(app); });
      render(app);
    });

    function current(app) { return app.orders.find(o => o.id === app.currentId) || app.orders[0]; }
    function statusMarkup(app, status) {
      const colors = { 'En Preparación': '#b45309', 'Listo para donar': '#15803d', 'Listo para Donar': '#15803d', 'Recibido': '#1d4ed8', 'Instalar SO': '#7e22ce', 'En reparación': '#b45309', 'En Reparación': '#b45309', 'Bloqueada': '#be123c', 'Donado': '#475569' };
      return `<span class="badge" style="--status-color:${colors[status] || '#64748b'}">${esc(status)}</span>`;
    }
    function filteredOrders(app) {
      const q = app.search.toLocaleLowerCase('es');
      return app.orders.filter(o => {
        const textMatch = !q || o.recipient.toLocaleLowerCase('es').includes(q) || o.teams.some(t => t.serial.toLocaleLowerCase('es').includes(q));
        const from = !app.dateFrom || o.date >= app.dateFrom;
        const to = !app.dateTo || o.date <= app.dateTo;
        return textMatch && from && to;
      });
    }
    function equipmentRows(app, order) {
      if (!order.teams.length) return `<div class="empty">Aún no hay equipos asociados, edite la orden para vincularlos</div>`;
      const teams = app.mode === 'edit' ? app.draft.teams : order.teams;
      return `<div class="equipment-list">${teams.map(t => `<div class="equipment"><span class="equip-name">${esc(t.name)}${app.mode === 'edit' && t.added ? ' <span class="draft-tag">Pendiente</span>' : ''}${app.mode === 'edit' && t.removed ? ' <span class="draft-tag">Se quitará</span>' : ''}</span><span class="serial">${esc(t.serial)}</span><span>${statusMarkup(app, t.status)}</span><span class="specs">${esc(t.specs)}</span>${app.mode === 'edit' ? `<button class="small danger" data-action="remove-team" data-id="${t.id}" ${t.removed ? 'disabled' : ''}>Quitar</button>` : ''}</div>`).join('')}</div>`;
    }
    function contentFor(app) {
      if (app.state === 'loading') return `<div class="loading"><span class="spinner"></span>Cargando</div>`;
      if (app.state === 'error') return `<div class="error"><b>Error en la consulta.</b><br>No se pudieron cargar los datos. Volvé a intentarlo.</div>`;
      if (app.page === 'inventory') return inventoryPage(app);
      if (app.page === 'detail') return detailPage(app);
      return ordersPage(app);
    }
    function ordersPage(app) {
      const rows = app.state === 'empty-orders' ? [] : app.state === 'no-results' ? [] : filteredOrders(app);
      let body = '';
      if (app.state === 'empty-orders' || (!rows.length && !app.search && !app.dateFrom && !app.dateTo)) body = `<div class="empty">No hay órdenes disponibles</div>`;
      else if (!rows.length) body = `<div class="empty">No se encontraron resultados</div>`;
      else body = `<div class="table-wrap inventory-table-panel"><table><thead><tr><th>Destinatario</th><th>Fecha de entrega</th><th>Estado</th></tr></thead><tbody>${rows.map(o => `<tr data-action="open-order" data-id="${o.id}"><td><b>${esc(o.recipient)}</b></td><td>${new Date(o.date + 'T12:00:00').toLocaleDateString('es-AR')}</td><td>${statusMarkup(app, o.status)}</td></tr>`).join('')}</tbody></table></div>`;
      return `<div class="page-title inventory-heading"><div><h3>Órdenes</h3><div class="muted">Órdenes de donación registradas</div></div><div class="actions"><button class="primary" data-action="create">Crear orden</button></div></div><div class="filters inventory-toolbar"><label>Buscar<input data-input="search" placeholder="Destinatario o número de serie" value="${esc(app.search)}"></label><label>Fecha desde<input data-input="from" type="date" value="${app.dateFrom}"></label><label>Fecha hasta<input data-input="to" type="date" value="${app.dateTo}"></label></div>${body}`;
    }
    function detailPage(app) {
      const order = current(app); if (!order) return '<div class="empty">No hay órdenes disponibles</div>';
      const editable = app.mode === 'edit' && order.status !== 'Donado';
      const d = editable ? app.draft : order;
      const actions = order.status === 'Donado'
        ? `<button data-action="return-prep">Volver a En Preparación</button>`
        : app.mode === 'edit'
          ? `<button data-action="cancel-edit">Cancelar</button><button class="primary" data-action="save">Guardar Cambios</button>`
          : `<button data-action="edit">Editar</button><button data-action="mark-donated">Marcar como Donado</button>${!order.teams.length ? '<button class="danger" data-action="delete">Eliminar orden</button>' : ''}`;
      const fields = `<section class="field-grid"><label>Destinatario${editable ? `<input data-field="recipient" value="${esc(d.recipient)}">` : `<span class="read-value">${esc(order.recipient)}</span>`}</label><label>Fecha de entrega${editable ? `<input data-field="date" type="date" value="${d.date}">` : `<span class="read-value">${new Date(order.date + 'T12:00:00').toLocaleDateString('es-AR')}</span>`}</label><label>Estado<span class="read-value">${statusMarkup(app, order.status)}</span></label><label class="wide">Descripción${editable ? `<textarea data-field="description" rows="2">${esc(d.description)}</textarea>` : `<span class="read-value">${esc(order.description || '—')}</span>`}</label></section>`;
      const teams = `<section><div class="section-head"><h4>Equipos asociados <span class="muted">(${editable ? app.draft.teams.filter(t => !t.removed).length : order.teams.length})</span></h4>${editable ? '<button class="small" data-action="add-team">Agregar equipo</button>' : ''}</div>${equipmentRows(app, order)}</section>`;
      const inner = `${fields}${teams}`;
      return `<div class="page-title inventory-heading"><div><button class="small" data-action="back">← Órdenes</button><h3 style="margin-top:12px">${esc(order.recipient)}</h3><div class="muted">Orden #${order.id} · ${statusMarkup(app, order.status)}</div></div><div class="actions">${actions}</div></div>${inner}`;
    }
    function inventoryPage(app) {
      const team = baseOrders[0].teams[0];
      const order = baseOrders[0];
      return `<div class="page-title inventory-heading"><div><h3>Equipo · ${esc(team.serial)}</h3><div class="muted">Inventario / detalle del equipo</div></div><button data-action="back">Volver</button></div><div class="inventory-order"><div><strong>Orden de donación</strong><a data-action="open-inventory-order">${esc(order.recipient)}</a><span class="muted">Fecha de entrega: ${new Date(order.date + 'T12:00:00').toLocaleDateString('es-AR')}</span></div>${statusMarkup(app, order.status)}</div><div class="inventory-fields"><label>Modelo<input value="ThinkPad T480" readonly></label><label>Marca<input value="Lenovo" readonly></label><label>Número de serie<input value="${esc(team.serial)}" readonly></label><label>Estado<input value="${esc(team.status)}" readonly></label><label style="grid-column:1/-1">Especificaciones<input value="${esc(team.specs)}" readonly></label></div>`;
    }
    function modalMarkup(app) {
      if (!app.modal) return '';
      if (app.modal.type === 'add') {
        const q = app.modal.query.toLocaleLowerCase('es');
        const choices = (app.state === 'no-available' ? [] : availableTeams).filter(t => !app.draft.teams.some(x => x.id === t.id && !x.removed) && `${t.name} ${t.model} ${t.serial}`.toLocaleLowerCase('es').includes(q));
        return `<div class="modal-backdrop"><div class="modal"><h3>Agregar equipos a la orden</h3><p>Buscá por número de serie, modelo o nombre y seleccioná uno o varios equipos. La asociación se guarda al pulsar Guardar Cambios en la orden.</p><input class="modal-search" data-input="modal-search" placeholder="Buscar equipo" value="${esc(app.modal.query)}">${choices.length ? `<div class="select-list">${choices.map(t => `<label class="select-row"><input type="checkbox" data-choice="${t.id}" ${app.modal.selected.has(t.id) ? 'checked' : ''}><span><b>${esc(t.name)} · ${esc(t.serial)}</b><small>${esc(t.model)} · ${esc(t.specs)}</small></span></label>`).join('')}</div>` : `<div class="empty">Aún no hay equipos asociados, edite la orden para vincularlos</div>`}<div class="modal-actions"><button data-action="close-modal">Cancelar</button><button class="primary" data-action="stage-add">Agregar selección</button></div></div></div>`;
      }
      if (app.modal.type === 'remove') return `<div class="modal-backdrop"><div class="modal"><h3>Quitar equipo</h3><p>Elegí el estado con el que el equipo volverá al Inventario al guardar los cambios de la orden.</p><label>Estado de retorno<select data-input="return-status"><option>Listo para donar</option><option>Recibido</option><option>Instalar SO</option><option>En reparación</option><option>Bloqueada</option><option>Donado</option></select></label><div class="modal-actions"><button data-action="close-modal">Cancelar</button><button class="primary" data-action="stage-remove">Quitar de la orden</button></div></div></div>`;
      if (app.modal.type === 'leave') return `<div class="modal-backdrop"><div class="modal"><h3>Se perderán los cambios</h3><p>Si salís ahora, se descartarán las modificaciones sin guardar.</p><div class="modal-actions"><button data-action="stay-editing">Seguir editando</button><button class="danger" data-action="leave-discard">Salir sin guardar</button></div></div></div>`;
      if (app.modal.type === 'return-prep') return `<div class="modal-backdrop"><div class="modal"><h3>Volver a En Preparación</h3><p>Los equipos asociados volverán al estado Listo para donar y la orden podrá editarse otra vez.</p><div class="modal-actions"><button data-action="close-modal">Cerrar</button><button class="primary" data-action="confirm-return">Cambiar</button></div></div></div>`;
      if (app.modal.type === 'create') return `<div class="modal-backdrop"><div class="modal"><h3>Crear orden</h3><div class="field-grid"><label>Destinatario<input data-input="new-recipient" placeholder="Nombre del destinatario"></label><label>Fecha de entrega<input data-input="new-date" type="date"></label><label class="wide">Descripción<textarea data-input="new-description" rows="2"></textarea></label></div><div class="modal-actions"><button data-action="close-modal">Cancelar</button><button class="primary" data-action="save-create">Crear orden</button></div></div></div>`;
      if (app.modal.type === 'delete') return `<div class="modal-backdrop"><div class="modal"><h3>Eliminar orden</h3><p>Esta orden no tiene equipos asociados. ¿Querés eliminarla?</p><div class="modal-actions"><button data-action="close-modal">Cancelar</button><button class="danger" data-action="confirm-delete">Eliminar orden</button></div></div></div>`;
      return '';
    }
    function allStatesMarkup() {
      return `<h3>Vista rápida de estados</h3><div class="state-mini"><b>Tabla sin órdenes</b><span>No hay órdenes disponibles</span></div><div class="state-mini"><b>Sin coincidencias</b><span>No se encontraron resultados</span></div><div class="state-mini"><b>Detalle sin equipos</b><span>Aún no hay equipos asociados, edite la orden para vincularlos</span></div><div class="state-mini"><b>Cargando</b><span>Indicador de carga acorde a la página</span></div><div class="state-mini"><b>Error de lectura</b><span>Error en la consulta</span></div>`;
    }
    function render(app) {
      const rootApp = document.getElementById(`alt-${app.id}`);
      const nav = `<header class="app-nav inventory-header"><span class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="1"></rect><path d="M8 21h8M12 17v4"></path></svg>Taller Solidario</span><nav class="nav-links inventory-nav" aria-label="Navegación principal"><button data-action="go-inventory" class="${app.page === 'inventory' ? 'active' : ''}">Inventario</button><button>Asistencias</button><button>Tutoriales</button><button data-action="go-orders" class="${app.page !== 'inventory' ? 'active' : ''}">Órdenes</button></nav></header>`;
      rootApp.querySelector('[data-screen]').innerHTML = nav + `<main class="inventory-content">${contentFor(app)}${app.toast ? `<div class="toast">${esc(app.toast)}</div>` : ''}</main>` + modalMarkup(app);
      const all = rootApp.querySelector('[data-allstates]'); all.innerHTML = allStatesMarkup(); all.classList.toggle('hidden', !app.allStates);
      rootApp.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', () => act(app, el.dataset.action, el.dataset.id)));
      rootApp.querySelectorAll('[data-input]').forEach(el => el.addEventListener('input', () => {
        if (el.dataset.input === 'search') { app.search = el.value; const pos = el.selectionStart; render(app); const n = rootApp.querySelector('[data-input="search"]'); n.focus(); n.setSelectionRange(pos, pos); }
        if (el.dataset.input === 'from') { app.dateFrom = el.value; render(app); }
        if (el.dataset.input === 'to') { app.dateTo = el.value; render(app); }
        if (el.dataset.input === 'modal-search') { app.modal.query = el.value; render(app); const n = rootApp.querySelector('[data-input="modal-search"]'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); }
        if (el.dataset.input === 'return-status') app.modal.returnStatus = el.value;
        if (el.dataset.input === 'new-recipient') app.modal.recipient = el.value;
        if (el.dataset.input === 'new-date') app.modal.date = el.value;
        if (el.dataset.input === 'new-description') app.modal.description = el.value;
      }));
      rootApp.querySelectorAll('[data-field]').forEach(el => el.addEventListener('input', () => { app.draft[el.dataset.field] = el.value; }));
      rootApp.querySelectorAll('[data-choice]').forEach(el => el.addEventListener('change', () => { const id = Number(el.dataset.choice); el.checked ? app.modal.selected.add(id) : app.modal.selected.delete(id); }));
    }
    function act(app, action, value) {
      const order = current(app);
      if (action === 'go-orders') { app.page = 'orders'; app.mode = 'view'; }
      if (action === 'go-inventory') app.page = 'inventory';
      if (action === 'back') { if (app.mode === 'edit') app.modal = { type: 'leave' }; else app.page = 'orders'; }
      if (action === 'open-order') { app.currentId = Number(value); app.page = 'detail'; app.mode = 'view'; }
      if (action === 'open-inventory-order') { app.currentId = 18; app.page = 'detail'; app.mode = 'view'; }
      if (action === 'edit') { app.mode = 'edit'; app.draft = structuredClone(order); }
      if (action === 'cancel-edit') app.modal = { type: 'leave' };
      if (action === 'stay-editing' || action === 'close-modal') app.modal = null;
      if (action === 'leave-discard') { app.modal = null; app.mode = 'view'; app.draft = null; app.page = 'orders'; }
      if (action === 'add-team') app.modal = { type: 'add', query: '', selected: new Set() };
      if (action === 'stage-add') { app.modal.selected.forEach(id => { const t = availableTeams.find(x => x.id === id); app.draft.teams.push({ ...t, status: 'Listo para donar', added: true }); }); app.modal = null; }
      if (action === 'remove-team') { app.modal = { type: 'remove', teamId: Number(value), returnStatus: 'Listo para donar' }; }
      if (action === 'stage-remove') { const team = app.draft.teams.find(t => t.id === app.modal.teamId); if (team) { team.removed = true; team.status = app.modal.returnStatus || 'Listo para donar'; } app.modal = null; }
      if (action === 'save') {
        if (!app.draft.recipient || !app.draft.date) app.toast = 'Falta destinatario o fecha; no se guardó la edición.';
        else { app.draft.teams = app.draft.teams.filter(t => !t.removed); app.draft.status = order.status; app.orders = app.orders.map(o => o.id === order.id ? structuredClone(app.draft) : o); app.mode = 'view'; app.draft = null; app.toast = 'Cambios guardados en una sola operación.'; }
      }
      if (action === 'mark-donated') { order.status = 'Donado'; order.teams.forEach(t => t.status = 'Donado'); app.toast = 'Orden y equipos actualizados.'; }
      if (action === 'return-prep') app.modal = { type: 'return-prep' };
      if (action === 'confirm-return') { order.status = 'En Preparación'; order.teams.forEach(t => t.status = 'Listo para donar'); app.modal = null; app.toast = 'La orden volvió a En Preparación.'; }
      if (action === 'create') app.modal = { type: 'create', recipient: '', date: '', description: '' };
      if (action === 'save-create') { const m = app.modal; if (m.recipient && m.date) { const created = { id: 19, recipient: m.recipient, date: m.date, status: 'En Preparación', description: m.description || '', teams: [] }; app.orders.unshift(created); app.currentId = created.id; app.page = 'detail'; app.modal = null; } else app.toast = 'Completá destinatario y fecha de entrega.'; }
      if (action === 'delete') app.modal = { type: 'delete' };
      if (action === 'confirm-delete') { app.orders = app.orders.filter(o => o.id !== order.id); app.page = 'orders'; app.modal = null; app.toast = 'Orden eliminada.'; }
      render(app);
    }
  </script>
</body>
</html>
